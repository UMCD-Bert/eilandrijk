<title>Eilandrijk</title>
<link rel="stylesheet" href="css/style.css">
<div id="app">
  <header class="top">
    <h1><span class="logo" aria-hidden="true"></span>Eilandrijk</h1>
    <div class="top-actions">
      <button id="btn-rules" class="ghost">Regels</button>
      <button id="btn-new" class="ghost">Nieuw spel</button>
    </div>
  </header>
  <main>
    <section id="board-wrap">
      <div id="status" role="status" aria-live="polite"></div>
      <div id="board"></div>

  </main>
  <div id="modal-root"></div>
  <div id="toast" role="alert"></div>
</div>
<script src="js/topology.js"></script>
<script src="js/engine.js"></script>
